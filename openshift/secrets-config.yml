apiVersion: v1
kind: Namespace
metadata:
  name: correpalabras
---
apiVersion: v1
kind: Secret
metadata:
  name: correpalabras-db
  namespace: correpalabras
type: Opaque
stringData:
  connection-string: "" # Replace with your PostgreSQL connection string
---
apiVersion: v1
kind: Secret
metadata:
  name: correpalabras-secrets
  namespace: correpalabras
type: Opaque
stringData:
  jwt-key: "" # Replace with your JWT secret key
  jwt-issuer: "" # Replace with your JWT issuer
  jwt-audience: "" # Replace with your JWT audience
---
apiVersion: v1
kind: Secret
metadata:
  name: correpalabras-email
  namespace: correpalabras
type: Opaque
stringData:
  smtp-server: "" # Replace with SMTP server
  smtp-port: "587"
  username: "" # Replace with email username
  password: "" # Replace with email password
  from-address: "" # Replace with from email address
  from-name: "CorrePalabras"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: correpalabras-config
  namespace: correpalabras
data:
  allowed-origins: "https://your-frontend-url.com,http://localhost:3000"
