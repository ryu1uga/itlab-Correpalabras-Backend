apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: correpalabras-backend-git
  namespace: dev-itlab
  labels:
    app: correpalabras-backend-git
    group: correpalabras-git-app
spec:
  replicas: 2
  selector:
    app: correpalabras-backend-git
  strategy:
    type: Rolling
    rollingParams:
      updatePeriodSeconds: 1
      intervalSeconds: 1
      timeoutSeconds: 600
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: correpalabras-backend-git
        group: correpalabras-git-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: default
      serviceAccount: default
      containers:
        - name: correpalabras-backend-git
          image: image-registry.openshift-image-registry.svc:5000/dev-itlab/correpalabras-backend-git:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            # Variables de base de datos
            - name: DB_HOST
              value: correpalabras-backend-git
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: correpalabras
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            # Configuración de la aplicación
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: app-url
            # JWT
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-key
            - name: JWT_ISSUER
              value: CorrePalabrasAPI
            - name: JWT_AUDIENCE
              value: CorrePalabrasApp
            # Cloudinary
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: cloudinary-cloud-name
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: cloudinary-api-key
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: cloudinary-api-secret
          livenessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - correpalabras-backend-git
                topologyKey: kubernetes.io/hostname
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - correpalabras-backend-git
        from:
          kind: ImageStreamTag
          name: correpalabras-backend-git:latest
          namespace: dev-itlab
    - type: ConfigChange
