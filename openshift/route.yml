apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: correpalabras-api
  namespace: correpalabras
  labels:
    app: correpalabras-api
spec:
  to:
    kind: Service
    name: correpalabras-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
